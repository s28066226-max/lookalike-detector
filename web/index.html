<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Look-Alike Detector</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<style>
  :root {
    --bg: #f5f7fc; --bg-hero: #eef2ff; --card: #ffffff; --text: #141a2b; --muted: #5b6579; --faint: #8a93a6;
    --border: #e1e6f0; --chip: #eef1f7; --accent: #3b5bdb; --accent-2: #5f3dc4; --accent-text: #ffffff;
    --good: #12805c; --good-bg: #e3f6ee; --warn: #a15c00; --warn-bg: #fff2d9; --bad: #c0262d; --bad-bg: #fdeaea;
    --saffron: #f59f00; --ring-track: #e6e9f2;
    --shadow: 0 1px 2px rgba(20, 30, 60, .05), 0 8px 28px rgba(20, 30, 60, .07);
    --shadow-strong: 0 2px 4px rgba(40, 60, 140, .08), 0 14px 40px rgba(40, 60, 140, .14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e121a; --bg-hero: #141a2e; --card: #171d29; --text: #e9edf5; --muted: #9ba6bb; --faint: #6f7a90;
      --border: #273042; --chip: #212a3a; --accent: #7b96ff; --accent-2: #a084ff; --accent-text: #0b1020;
      --good: #4fd1a1; --good-bg: #12302a; --warn: #f5b84b; --warn-bg: #33270f; --bad: #ff7d7d; --bad-bg: #3a1619;
      --saffron: #ffb44a; --ring-track: #273042;
      --shadow: none; --shadow-strong: 0 10px 40px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.55; -webkit-font-smoothing: antialiased;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari",
                      "Noto Sans Bengali", "Noto Sans Gujarati", "Noto Sans Tamil", "Noto Sans Telugu", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

  /* Hero */
  .hero { background:
            radial-gradient(600px 260px at 15% 0%, rgba(59, 91, 219, .16), transparent 70%),
            radial-gradient(520px 240px at 95% 10%, rgba(245, 159, 0, .12), transparent 70%),
            var(--bg-hero);
          border-bottom: 1px solid var(--border); padding-bottom: 28px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 0; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 18px; letter-spacing: -.01em; }
  .logo img { width: 34px; height: 34px; }
  .lang { position: relative; display: flex; align-items: center; }
  .lang svg { position: absolute; left: 11px; color: var(--muted); pointer-events: none; }
  .lang select { appearance: none; -webkit-appearance: none; background: var(--card); border: 1px solid var(--border);
                 border-radius: 999px; padding: 7px 34px 7px 34px; font-size: 14px; cursor: pointer; box-shadow: var(--shadow); }
  .lang::after { content: ""; position: absolute; right: 14px; width: 7px; height: 7px; border-right: 2px solid var(--muted);
                 border-bottom: 2px solid var(--muted); transform: rotate(45deg) translateY(-3px); pointer-events: none; }
  h1 { font-size: clamp(28px, 6vw, 44px); line-height: 1.15; letter-spacing: -.025em; margin: 22px 0 10px; max-width: 680px; }
  h1 .hl { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--muted); font-size: 17px; margin: 0 0 22px; max-width: 640px; }
  .search { display: flex; gap: 8px; background: var(--card); padding: 8px; border-radius: 18px; border: 1px solid var(--border);
            box-shadow: var(--shadow-strong); }
  .search .field { flex: 1; display: flex; align-items: center; gap: 10px; padding-left: 10px; min-width: 0; }
  .search .field svg { color: var(--faint); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 17px; padding: 10px 0; }
  .btn { border: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 650; font-size: 16px;
         padding: 0 26px; border-radius: 12px; cursor: pointer; min-height: 48px; transition: transform .1s, filter .15s; }
  @media (prefers-color-scheme: dark) { .btn { color: #0b1020; } }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .65; cursor: wait; }
  .trust { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .trust span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); background: var(--card);
                border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px 4px 9px; }
  .trust svg { color: var(--accent); flex: none; }

  /* Examples */
  .examples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 22px 0 0; }
  .ex-group { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px 12px; }
  .ex-group h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .ex-group h3 i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .ex-group button { display: block; width: 100%; text-align: left; border: 0; background: var(--chip); border-radius: 9px; padding: 6px 10px;
                     margin-top: 6px; cursor: pointer; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-group button:hover { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* Cards */
  main { padding: 24px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
  .pad { padding: 20px 22px; }
  h2 { font-size: 17px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; letter-spacing: -.01em; }
  .fade { animation: fade .35s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } .spinner { animation-duration: 2s; } }

  /* Progress */
  .steps { list-style: none; margin: 0; padding: 6px 0; }
  .steps li { display: flex; align-items: center; gap: 12px; padding: 10px 22px; color: var(--faint); font-size: 16px; }
  .steps li.active { color: var(--text); font-weight: 600; }
  .steps li.done { color: var(--muted); }
  .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); flex: none; display: grid; place-items: center; }
  .steps li.done .dot { background: var(--good); border-color: var(--good); color: var(--card); }
  .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Verdict */
  .verdict { display: flex; align-items: center; gap: 18px; padding: 22px; }
  .verdict.genuine { background: var(--good-bg); --tone: var(--good); }
  .verdict.suspicious { background: var(--warn-bg); --tone: var(--warn); }
  .verdict.likely_fake { background: var(--bad-bg); --tone: var(--bad); }
  .v-icon { color: var(--tone); flex: none; }
  .v-text { flex: 1; min-width: 0; }
  .v-label { color: var(--tone); font-size: clamp(26px, 5vw, 34px); font-weight: 800; line-height: 1.15; letter-spacing: -.02em; }
  .v-line { margin-top: 4px; font-size: 16px; }
  .ring { flex: none; position: relative; width: 84px; height: 84px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
  .ring b { font-size: 22px; color: var(--tone); }
  .ring small { display: block; font-size: 10px; color: var(--muted); max-width: 70px; }
  .addr { padding: 14px 22px 16px; display: grid; gap: 6px; font-size: 15px; border-top: 1px solid var(--border); }
  .addr .k { color: var(--muted); margin-right: 6px; }
  .host { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; word-break: break-all; }
  .host .dim { color: var(--faint); }
  .host b { background: var(--chip); padding: 1px 5px; border-radius: 6px; }

  /* Why */
  .why ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .why li { display: flex; gap: 10px; font-size: 16.5px; }
  .why li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 10px; border-radius: 50%; background: var(--accent); }
  .source { margin-top: 14px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .source .spinner { width: 14px; height: 14px; border-width: 2px; }
  .gemma-badge { display: inline-flex; align-items: center; gap: 5px; background: var(--chip); border-radius: 999px; padding: 2px 9px; }

  /* Three checks */
  .checks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .check { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); border-top: 4px solid var(--tone); }
  .check.bad { --tone: var(--bad); } .check.warn { --tone: var(--warn); } .check.ok { --tone: var(--good); } .check.skip { --tone: var(--border); }
  .c-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .c-head strong { font-size: 15px; }
  .pill { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; color: var(--tone); background: var(--chip); white-space: nowrap; }
  .check.skip .pill { color: var(--faint); }
  .check ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 14px; }
  .check li { display: flex; gap: 8px; }
  .check li svg { flex: none; margin-top: 3px; }
  .check .none { color: var(--muted); font-size: 14px; }
  .check .gemma { margin-top: 10px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 8px; }

  /* Screenshot in a browser frame */
  .browser { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; max-width: 520px; background: var(--chip); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--border); display: inline-block; margin-right: 4px; }
  .urlpill { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: 8px; padding: 3px 9px;
             font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .browser img { display: block; width: 100%; cursor: zoom-in; }

  /* Technical details */
  details summary { cursor: pointer; font-weight: 650; padding: 16px 22px; list-style-position: inside; }
  details[open] summary { border-bottom: 1px solid var(--border); }
  .sig { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; padding: 14px 22px; font-size: 14px; align-items: baseline; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; text-align: center; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; }
  .tag.high { background: var(--bad-bg); color: var(--bad); } .tag.medium { background: var(--warn-bg); color: var(--warn); }
  .tag.low, .tag.info { background: var(--chip); color: var(--muted); } .tag.good { background: var(--good-bg); color: var(--good); }
  .code { color: var(--faint); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .skipped { padding: 0 22px 16px; font-size: 14px; color: var(--muted); }
  .error { color: var(--bad); }

  /* Tips */
  .tips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tip { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; font-size: 14.5px; }
  .tip .ti { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 10px;
             background: linear-gradient(135deg, rgba(59, 91, 219, .14), rgba(95, 61, 196, .14)); color: var(--accent); }
  .tips-title { font-size: 18px; margin: 28px 0 12px; }

  dialog { border: 0; padding: 0; border-radius: 14px; max-width: 95vw; background: var(--card); }
  dialog img { display: block; max-width: 95vw; max-height: 90vh; }
  dialog::backdrop { background: rgba(0, 0, 0, .7); }
  footer { margin: 30px 0 36px; font-size: 13px; color: var(--faint); text-align: center; }

  @media (max-width: 720px) {
    .examples, .checks, .tips { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) {
    .search { flex-direction: column; }
    .search .field { padding: 0 6px; }
    .verdict { padding: 18px 16px; gap: 12px; }
    .v-icon svg { width: 36px; height: 36px; }
    .ring { width: 68px; height: 68px; } .ring svg { width: 68px; height: 68px; }
    .pad, .addr, .sig, details summary { padding-left: 16px; padding-right: 16px; }
    .logo span { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="hero">
  <div class="wrap">
    <div class="top">
      <div class="logo"><img src="/static/logo.svg" alt=""><span data-t="brand"></span></div>
      <label class="lang">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20"/></svg>
        <select id="lang" aria-label="Language">
          <option value="en">English</option><option value="hi">हिंदी</option><option value="mr">मराठी</option>
          <option value="bn">বাংলা</option><option value="gu">ગુજરાતી</option><option value="ta">தமிழ்</option><option value="te">తెలుగు</option>
        </select>
      </label>
    </div>

    <h1 id="title"></h1>
    <p class="sub" data-t="subtitle"></p>

    <form class="search" id="form">
      <div class="field">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 13a5 5 0 007.07 0l3-3a5 5 0 00-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 00-7.07 0l-3 3a5 5 0 007.07 7.07l1.5-1.5"/></svg>
        <input id="url" type="text" autocomplete="off" spellcheck="false" inputmode="url">
      </div>
      <button class="btn" id="go" type="submit" data-t="check"></button>
    </form>

    <div class="trust" id="trust"></div>
    <div class="examples" id="examples"></div>
  </div>
</div>

<div class="wrap">
  <main id="out"></main>
  <h2 class="tips-title" data-t="tipsTitle"></h2>
  <div class="tips" id="tips"></div>
  <footer data-t="footer"></footer>
</div>
<dialog id="zoom"><img alt=""></dialog>

try { lang = localStorage.getItem("lang") || "en"; } catch (e) {}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fill(template, vars) { return template.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? ""); }

function renderStatic() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
  $("#title").innerHTML = `${esc(t.titleA)}<span class="hl">${esc(t.titleHl)}</span>${esc(t.titleB)}`;
  $("#url").placeholder = t.placeholder;
  $("#lang").value = lang;
  $("#trust").innerHTML = t.trust.map((x, i) => `<span>${svg(14, TRUST_ICONS[i])}${esc(x)}</span>`).join("");
  $("#examples").innerHTML = ["demo", "real", "tricky"].map((g) => `
    <div class="ex-group"><h3><i style="background:${GROUP_COLOR[g]}"></i>${esc(t.groups[g])}</h3>
      ${EXAMPLES.filter((e) => e.group === g).map((e) => `<button type="button" data-url="${esc(e.url)}" title="${esc(e.url)}">${esc(e.label)}</button>`).join("")}
    </div>`).join("");
  $("#tips").innerHTML = t.tips.map((x, i) => `<div class="tip"><div class="ti">${svg(20, TIP_ICONS[i])}</div>${esc(x)}</div>`).join("");

function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  renderStatic();
  if (report) { render(); requestExplanation(l); }
  else if (out.querySelector(".steps")) drawLoading();
  else if (out.querySelector(".error")) out.innerHTML = "";
}

// --- Loading: three steps that mirror the three checks -------------------------
function drawLoading() {
  const t = T[lang];
  out.innerHTML = `<div class="card fade"><ul class="steps">${t.steps.map((s, i) => {
    const state = i < loadingStep ? "done" : i === loadingStep ? "active" : "";
    const mark = state === "done" ? `<span class="dot">${ICON.tick}</span>` : state === "active" ? `<span class="spinner"></span>` : `<span class="dot"></span>`;
    return `<li class="${state}">${mark}${esc(s)}</li>`;
  }).join("")}</ul></div>`;
}
function startLoading() {
  stepTimers.forEach(clearTimeout);
  loadingStep = 0;
  drawLoading();
  // The API answers once, so the first two steps advance on a timer; the last waits for the reply.
  stepTimers = [setTimeout(() => { loadingStep = 1; drawLoading(); }, 900),
                setTimeout(() => { loadingStep = 2; drawLoading(); }, 3200)];
}

async function runCheck(url) {
  url = url.trim();
  if (!url) { out.innerHTML = `<div class="card pad error fade">${esc(T[lang].empty)}</div>`; return; }
  const id = ++checkId;
  report = null; explanations = {};
  $("#go").disabled = true;
  startLoading();
  out.scrollIntoView({ behavior: "smooth", block: "start" });
  try {
    const res = await fetch("/api/check", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }) });
    if (res.status === 429) { out.innerHTML = `<div class="card pad error fade">${esc(T[lang].busy)}</div>`; return; }
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (id !== checkId) return;
    report = data;
    render();
    requestExplanation(lang);
  } catch (e) {
    if (id === checkId) out.innerHTML = `<div class="card pad error fade">${esc(T[lang].error)}</div>`;
  } finally {
    if (id === checkId) { stepTimers.forEach(clearTimeout); $("#go").disabled = false; }
  }
}

async function requestExplanation(l) {
  if (!report || explanations[l]) return;
  const id = checkId;
  explanations[l] = { pending: true };
  const body = { host: report.host, verdict: report.verdict, brand: report.brand, lang: l,
                 signals: report.signals.map(({ code, severity, points, detail }) => ({ code, severity, points, detail })) };
  try {
    const res = await fetch("/api/explain", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (id !== checkId) return;
    explanations[l] = data;
  } catch (e) {
    if (id !== checkId) return;
    explanations[l] = { bullets: report.quick_explanation[l], source: "fallback" };
  }
  if (l === lang) renderWhy();
}

// --- Result --------------------------------------------------------------------
function verdictLine(r) {
  const t = T[lang], brand = r.brand_names[lang];
  if (r.verdict === "genuine") return r.official_brand ? fill(t.lineOfficial, { brand }) : t.lineGenuine;
  if (r.verdict === "suspicious") return t.lineSuspicious;
  return brand ? fill(t.lineFake, { brand }) : t.lineFakeNoBrand;
}

// "sbi.secure-login.xyz" -> dim "sbi." and highlight "secure-login.xyz": the part that shows who really owns the site.
function hostHtml(r) {
  const h = r.host, reg = r.registered_domain;
  if (reg && h.endsWith(reg) && h !== reg) return `<span class="dim">${esc(h.slice(0, -reg.length))}</span><b>${esc(reg)}</b>`;
  return `<b>${esc(h)}</b>`;
}

function ring(r) {
  const c = 2 * Math.PI * 34, filled = (r.score / 100) * c;
  const arc = filled > 0 ? `<circle cx="42" cy="42" r="34" fill="none" stroke="${RING_COLOR[r.verdict]}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${filled} ${c}"/>` : "";
  return `<div class="ring" title="${esc(T[lang].risk)}: ${r.score}/100" aria-label="${esc(T[lang].risk)}: ${r.score}/100">
    <svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--ring-track)" stroke-width="8"/>${arc}</svg>
    <div class="num"><div><b>${r.score}</b><small>/100</small></div></div></div>`;
}

function checkCard(kind) {
  const r = report, t = T[lang];
  const sigs = r.signals.filter((s) => s.check === kind && s.points !== 0);
  const skipped = kind === "page" ? r.skipped.some((s) => s.startsWith("Page check"))
                : kind === "visual" ? !r.visual_brand : false;
  const bad = sigs.filter((s) => s.points > 0);
  let cls = "ok", pill = `✓`;
  if (bad.length) { cls = bad.some((s) => s.severity === "high") ? "bad" : "warn"; pill = `${bad.length} ⚠`; }
  else if (skipped) { cls = "skip"; pill = "–"; }
  const items = sigs.map((s) => `<li>${s.points < 0 ? ICON.check : ICON.warn}<span>${esc(s.plain[lang])}</span></li>`).join("");
  let body = items ? `<ul>${items}</ul>` : `<div class="none">${esc(skipped ? t.skippedShort : t.noProblems)}</div>`;
  if (kind === "visual" && r.visual_brand) {
    const vb = r.visual_brand;
    const seen = vb.brand ? fill(t.gemmaSaw, { brand: r.visual_brand_names[lang], conf: Math.round(vb.confidence * 100) }) : t.gemmaNone;
    body += `<div class="gemma">${esc(seen)}<br>${esc(t[r.backend] || r.backend)}</div>`;
  }
  return `<div class="check ${cls}"><div class="c-head"><strong>${esc(t.checks[kind])}</strong><span class="pill">${esc(pill)}</span></div>${body}</div>`;
}

function renderWhy() {
  const box = $("#why");
  if (!box || !report) return;
  const ex = explanations[lang], t = T[lang];
  const bullets = ex && ex.bullets ? ex.bullets : report.quick_explanation[lang];
  let source;
  if (!ex || ex.pending) source = `<div class="spinner"></div>${esc(t.writing)}`;
  else if (ex.source === "model") source = `<span class="gemma-badge">${ICON.sparkle}${esc(t.byModel)}</span>${esc(t[report.backend] || report.backend)}`;
  else source = esc(t.byFallback);
  box.innerHTML = `<h2>${ICON.sparkle}${esc(t.why)}</h2><ul>${bullets.map((b) => `<li>${esc(b)}</li>`).join("")}</ul><div class="source">${source}</div>`;
}

function render() {
  const r = report, t = T[lang];

  const actual = !r.official_brand && r.registered_domain && r.registered_domain !== r.host
    ? `<div><span class="k">${esc(t.actual)}:</span><span class="host"><b>${esc(r.registered_domain)}</b></span></div>` : "";
  const shownUrl = r.final_url || r.url;
  const secure = shownUrl.startsWith("https://");
  const signals = r.signals.map((s) => `
      <span class="tag ${esc(s.severity)}">${s.points > 0 ? "+" : ""}${s.points}</span>
      <span>${esc(s.detail)} <span class="code">${esc(s.code)}</span></span>`).join("");
  const skipped = r.skipped.length ? `<div class="skipped"><strong>${esc(t.skipped)}:</strong><br>${r.skipped.map(esc).join("<br>")}</div>` : "";

  out.innerHTML = `
    <div class="card fade">
      <div class="verdict ${esc(r.verdict)}">
        <div class="v-icon">${ICON[r.verdict]}</div>
        <div class="v-text"><div class="v-label">${esc(t.verdict[r.verdict])}</div><div class="v-line">${esc(verdictLine(r))}</div></div>
        ${ring(r)}
      </div>
      <div class="addr">
        <div><span class="k">${esc(t.website)}:</span><span class="host">${hostHtml(r)}</span></div>
        ${actual}${ended}
      </div>
    </div>
    <div class="card pad why fade" id="why"></div>
    <div class="checks fade">${checkCard("address")}${checkCard("page")}${checkCard("visual")}</div>
    ${r.screenshot ? `
    <div class="card pad fade"><h2>${esc(t.shot)}</h2>
      <div class="browser"><div class="bar"><span><i></i><i></i><i></i></span>
        <span class="urlpill">${secure ? ICON.lock : ICON.unlock}${esc(shownUrl)}</span></div>
        <img src="${r.screenshot}" alt="${esc(t.shot)}"></div></div>` : ""}
    <details class="card fade"><summary>${esc(t.details)}</summary><div class="sig">${signals}</div>${skipped}</details>`;
  renderWhy();
  const img = out.querySelector(".browser img");
  if (img) img.addEventListener("click", () => { $("#zoom img").src = img.src; $("#zoom").showModal(); });
}

$("#form").addEventListener("submit", (e) => { e.preventDefault(); runCheck($("#url").value); });
$("#lang").addEventListener("change", (e) => setLang(e.target.value));
$("#examples").addEventListener("click", (e) => {
  const b = e.target.closest("[data-url]");
  if (b) { $("#url").value = b.dataset.url; runCheck(b.dataset.url); }
});
$("#zoom").addEventListener("click", () => $("#zoom").close());
renderStatic();
</script>
</body>
</html>
